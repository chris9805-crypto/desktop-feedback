<title>Gapline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Source+Sans+3:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,600&display=swap">
<style>
  :root {
    --ground: #f6f7f9;
    --surface: #ffffff;
    --surface-2: #f1f3f6;
    --surface-3: #e7ebf0;
    --line: #e0e4ea;
    --line-strong: #c7cfda;
    --ink: #11161f;
    --muted: #5b6673;
    --faint: #858e9b;
    --accent: #1c5d88;
    --accent-ink: #164c70;
    --accent-soft: #e6eff6;
    --over: #a8532b;
    --over-soft: #fbeee6;
    --under: #1f6a56;
    --under-soft: #e6f2ee;
    --warn: #8a6100;
    --warn-soft: #fdf3dd;
    --c1: #0a7e3a; --c2: #d179ca; --c3: #6e64c8; --c4: #ca8a10;
    --c5: #a8353e; --c6: #a2af29; --c7: #337bd0; --c8: #d46a34;
    --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
    --sans: "Source Sans 3", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --r: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #0c1016; --surface: #141a22; --surface-2: #1a212a; --surface-3: #232c37;
      --line: #262f3b; --line-strong: #3b4755; --ink: #e4e9f0; --muted: #9aa4b2; --faint: #6f7987;
      --accent: #6cb0dd; --accent-ink: #8ec5eb; --accent-soft: #14283a;
      --over: #dd9160; --over-soft: #2e2018; --under: #63bfa0; --under-soft: #14261f;
      --warn: #d6a83f; --warn-soft: #2b2415;
      --c1: #25984d; --c2: #9d4997; --c3: #847ce2; --c4: #895c07;
      --c5: #d15b60; --c6: #737c06; --c7: #3e96ea; --c8: #af4803;
    }
  }
  :root[data-theme="dark"] {
    --ground: #0c1016; --surface: #141a22; --surface-2: #1a212a; --surface-3: #232c37;
    --line: #262f3b; --line-strong: #3b4755; --ink: #e4e9f0; --muted: #9aa4b2; --faint: #6f7987;
    --accent: #6cb0dd; --accent-ink: #8ec5eb; --accent-soft: #14283a;
    --over: #dd9160; --over-soft: #2e2018; --under: #63bfa0; --under-soft: #14261f;
    --warn: #d6a83f; --warn-soft: #2b2415;
    --c1: #25984d; --c2: #9d4997; --c3: #847ce2; --c4: #895c07;
    --c5: #d15b60; --c6: #737c06; --c7: #3e96ea; --c8: #af4803;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  h1, h2, h3 { font-family: var(--serif); font-weight: 600; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
  p { margin: 0; }
  button { font: inherit; color: inherit; cursor: pointer; }
  a { color: var(--accent-ink); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

  /* ---- chrome ---- */
  .topbar {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30;
    background: color-mix(in srgb, var(--surface) 94%, transparent);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
  }
  .topbar-inner {
    max-width: 1060px; margin: 0 auto; padding-block: 10px; padding-inline: 20px;
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px 18px;
  }
  .brand { display: flex; align-items: center; gap: 9px; margin-right: 4px; }
  .brand-mark {
    width: 22px; height: 22px; border-radius: 5px; background: var(--accent);
    display: grid; place-items: center; flex: none;
  }
  .brand-mark svg { display: block; }
  .brand-name { font-family: var(--serif); font-size: 16px; font-weight: 600; }
  nav { display: flex; flex-wrap: wrap; gap: 2px; }
  .tab {
    border: 0; background: none; padding: 5px 10px; border-radius: 7px;
    font-size: 13px; color: var(--muted); transition: background .12s, color .12s;
  }
  .tab:hover { background: var(--surface-2); color: var(--ink); }
  .tab[aria-current="page"] { background: var(--accent-soft); color: var(--accent-ink); font-weight: 600; }
  .topbar-note { margin-left: auto; font-size: 11.5px; color: var(--faint); }
  @media (max-width: 720px) { .topbar-note { display: none; } }

  main { max-width: 1060px; margin: 0 auto; padding-block: 26px 56px; padding-inline: 20px; }
  .stack { display: flex; flex-direction: column; gap: 22px; }
  .stack-s { display: flex; flex-direction: column; gap: 10px; }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
  .pad { padding: 18px; }

  .eyebrow { font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--faint); font-weight: 600; }
  .lede { color: var(--muted); font-size: 14px; max-width: 64ch; text-wrap: pretty; }
  .sec-title { font-size: 17px; }
  .sub { color: var(--muted); font-size: 13px; max-width: 70ch; text-wrap: pretty; }

  /* ---- stat strip ---- */
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); overflow: hidden; border-radius: var(--r); }
  @media (max-width: 860px) { .stats { grid-template-columns: repeat(2, 1fr); } }
  .stat { padding: 13px 16px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .stat:nth-child(4n) { border-right: 0; }
  @media (max-width: 860px) { .stat { border-right: 0; } .stat:nth-child(odd) { border-right: 1px solid var(--line); } }
  .stat:last-child, .stat:nth-last-child(2):nth-child(odd) { border-bottom: 0; }
  @media (min-width: 861px) { .stat:nth-child(n+5) { border-bottom: 0; } }
  .stat-k { font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); }
  .stat-v { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 19px; font-weight: 500; margin-top: 3px; line-height: 1.1; }
  .stat-d { font-size: 11.5px; color: var(--muted); margin-top: 4px; line-height: 1.35; }
  .t-over { color: var(--over); } .t-under { color: var(--under); } .t-warn { color: var(--warn); }

  /* ---- pills & chips ---- */
  .pill {
    display: inline-flex; align-items: center; border-radius: 99px; padding: 1px 8px;
    font-size: 11px; font-weight: 600; border: 1px solid var(--line); background: var(--surface-2); color: var(--muted);
  }
  .pill.accent { background: var(--accent-soft); color: var(--accent-ink); border-color: color-mix(in srgb, var(--accent) 30%, transparent); }
  .pill.over { background: var(--over-soft); color: var(--over); border-color: color-mix(in srgb, var(--over) 30%, transparent); }
  .pill.under { background: var(--under-soft); color: var(--under); border-color: color-mix(in srgb, var(--under) 30%, transparent); }
  .rank {
    flex: none; width: 28px; height: 28px; border-radius: 99px; display: grid; place-items: center;
    font-family: var(--mono); font-size: 11px; font-weight: 500;
    background: var(--surface-3); color: var(--muted);
  }
  .rank.over { background: var(--over-soft); color: var(--over); }
  .rank.under { background: var(--under-soft); color: var(--under); }

  /* ---- findings ---- */
  .finding { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
  .finding-head {
    display: flex; gap: 14px; align-items: flex-start; width: 100%;
    padding: 15px 18px; border: 0; background: none; text-align: left;
  }
  .finding-head:hover { background: var(--surface-2); }
  .finding-title { font-family: var(--serif); font-size: 15px; font-weight: 600; }
  .finding-sum { color: var(--muted); font-size: 13px; margin-top: 5px; text-wrap: pretty; }
  .finding-cue { flex: none; font-size: 12px; color: var(--faint); margin-top: 3px; }
  .finding-body { border-top: 1px solid var(--line); padding: 18px; display: flex; flex-direction: column; gap: 18px; }

  .ev { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 22px; }
  @media (max-width: 620px) { .ev { grid-template-columns: 1fr; } }
  .ev-item { border-left: 2px solid var(--line); padding-left: 11px; }
  .ev-k { font-size: 11.5px; color: var(--muted); }
  .ev-v { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 14px; font-weight: 500; }
  .ev-d { font-size: 11.5px; color: var(--faint); line-height: 1.35; margin-top: 2px; }

  .route { background: var(--surface-2); border-radius: 8px; padding: 11px 13px; }
  .route-k { font-size: 12.5px; font-weight: 600; }
  .route-d { font-size: 12.5px; color: var(--muted); margin-top: 3px; }

  .note { border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: 12px 14px; font-size: 12.5px; color: var(--muted); }
  .note.warn { border-color: color-mix(in srgb, var(--warn) 32%, transparent); background: var(--warn-soft); }
  .note.accent { border-color: color-mix(in srgb, var(--accent) 26%, transparent); background: var(--accent-soft); }
  .note strong { color: var(--ink); }

  /* ---- gap bars ---- */
  table.gap { width: 100%; border-collapse: collapse; }
  table.gap td { padding: 5px 0; vertical-align: middle; }
  .gap-label { font-size: 12.5px; color: var(--muted); padding-right: 12px !important; width: 36%; }
  .gap-track { position: relative; height: 16px; border-radius: 3px; background: var(--surface-2); }
  .gap-fill { position: absolute; inset-block: 0; left: 0; border-radius: 3px; }
  .gap-tick { position: absolute; inset-block: -3px; width: 2px; background: var(--ink); }
  @media (max-width: 620px) { .gap-label { width: 44%; } .gap-delta { width: 58px; } }
  .gap-val { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 12.5px; text-align: right; width: 62px; padding-left: 12px !important; }
  .gap-delta { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 12px; text-align: right; width: 68px; padding-left: 8px !important; }

  /* ---- stacked bar ---- */
  .bar { display: flex; height: 14px; border-radius: 99px; overflow: hidden; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 12px; }
  .legend-item { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--muted); }
  .swatch { width: 8px; height: 8px; border-radius: 2px; flex: none; }
  .legend-v { font-family: var(--mono); font-variant-numeric: tabular-nums; color: var(--ink); font-weight: 500; }

  /* ---- tables ---- */
  .scroll { overflow-x: auto; }
  table.data { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.data th {
    text-align: left; font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em;
    color: var(--faint); font-weight: 600; padding: 9px 12px; border-bottom: 1px solid var(--line); white-space: nowrap;
  }
  table.data td { padding: 9px 12px; border-bottom: 1px solid var(--line); }
  table.data tr:last-child td { border-bottom: 0; }
  table.data td.r, table.data th.r { text-align: right; }
  .sym { font-family: var(--mono); font-weight: 500; }
  .row-link { background: none; border: 0; padding: 0; font: inherit; color: var(--ink); text-decoration: underline; text-underline-offset: 2px; text-decoration-color: var(--line-strong); }
  .row-link:hover { text-decoration-color: var(--accent); }
  .mini { height: 5px; border-radius: 99px; background: var(--surface-3); }
  .mini > i { display: block; height: 100%; border-radius: 99px; background: var(--accent); }

  /* ---- forms ---- */
  label.field { display: block; }
  .field-k { font-size: 12px; font-weight: 600; }
  .field-h { font-size: 11.5px; color: var(--muted); line-height: 1.35; margin-top: 1px; }
  input[type="text"], input[type="number"], select, textarea {
    width: 100%; margin-top: 6px; padding: 8px 10px; font-size: 13px;
    border: 1px solid var(--line-strong); border-radius: 8px;
    background: var(--surface); color: var(--ink); font-family: inherit;
  }
  textarea { font-family: var(--mono); font-size: 12.5px; line-height: 1.6; resize: vertical; }
  input[type="range"] { width: 100%; accent-color: var(--accent); margin-top: 8px; }
  .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
  .grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
  .grid4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
  @media (max-width: 720px) { .grid3, .grid4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 480px) { .grid2, .grid3, .grid4 { grid-template-columns: 1fr; } }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
  @media (max-width: 900px) { .cols { grid-template-columns: 1fr; } }

  .btn {
    display: inline-flex; align-items: center; gap: 6px; border-radius: 8px;
    padding: 8px 13px; font-size: 13px; font-weight: 500; border: 1px solid transparent;
    background: var(--accent); color: #fff;
  }
  .btn:hover { filter: brightness(1.08); }
  .btn.sec { background: var(--surface); color: var(--ink); border-color: var(--line-strong); }
  .btn.sec:hover { background: var(--surface-2); filter: none; }
  .btn.ghost { background: none; color: var(--muted); }
  .btn.ghost:hover { background: var(--surface-2); color: var(--ink); }
  .btn:disabled { opacity: .45; pointer-events: none; }
  .btnrow { display: flex; flex-wrap: wrap; gap: 8px; }

  /* ---- score meter ---- */
  .meter-top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .meter-k { font-size: 12.5px; color: var(--muted); }
  .meter-v { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 16px; font-weight: 500; }
  .meter-track { height: 6px; border-radius: 99px; background: var(--surface-3); margin-top: 7px; overflow: hidden; }
  .meter-fill { height: 100%; background: var(--accent); border-radius: 99px; }
  .meter-note { font-size: 11.5px; color: var(--muted); margin-top: 7px; line-height: 1.4; }
  .kv { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; font-size: 12px; padding: 3px 0; }
  .kv dt { color: var(--muted); } .kv dd { margin: 0; font-family: var(--mono); font-variant-numeric: tabular-nums; font-weight: 500; }

  /* ---- article ---- */
  .prose { max-width: 66ch; }
  .prose h2 { font-size: 17px; margin-top: 26px; }
  .prose p { font-size: 14.5px; line-height: 1.72; color: var(--muted); margin-top: 12px; }
  .bullets { list-style: none; padding: 0; margin: 10px 0 0; display: flex; flex-direction: column; gap: 8px; }
  .bullets li { display: flex; gap: 10px; font-size: 13px; line-height: 1.55; }
  .bullets li::before { content: ""; flex: none; width: 4px; height: 4px; border-radius: 99px; background: var(--accent); margin-top: 8px; }

  /* ---- modal ---- */
  .scrim { position: fixed; inset: 0; z-index: 60; background: rgba(6, 10, 16, .55); display: grid; place-items: center; padding: 18px; }
  .modal { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; max-width: 520px; width: 100%; max-height: 88vh; overflow-y: auto; padding: 22px; }

  .foot { margin-top: 36px; padding-top: 18px; border-top: 1px solid var(--line); font-size: 11.5px; color: var(--faint); line-height: 1.6; }
  .empty { text-align: center; padding: 48px 20px; }
</style>

y live through.","Risk capacity asks a factual question instead. If the portfolio fell by a quarter tomorrow and took six years to recover, what would actually break? If the answer is nothing \u2014 the money is not needed for twenty years, there is a cash buffer for emergencies, and contributions keep arriving \u2014 capacity is high regardless of how the fall feels. If the answer is that a house purchase gets postponed or a withdrawal has to be taken at the bottom, capacity is low no matter how relaxed you are about volatility."]},{heading:"Why capacity wins",paragraphs:["When the two disagree, capacity is the one that binds. Being comfortable with a 40% fall does not create the years needed to recover from one. This is why a short horizon caps the sensible growth allocation even for someone who describes themselves as aggressive, and why the reference model in this tool treats the capacity score as a ceiling rather than as another input to average.","The reverse case matters too, and gets less attention. A low tolerance with a high capacity \u2014 someone twenty-five years from retirement who keeps everything in cash \u2014 is also a mismatch. It feels safe because the balance never falls, and it quietly guarantees a smaller result, because inflation compounds against cash for the whole period."]},{heading:"What raises capacity",paragraphs:["Three things, none of which are investment decisions: lengthening the horizon, building the emergency buffer so the portfolio is not the first thing sold in a crisis, and increasing regular contributions so new money does some of the work that returns would otherwise have to do. Each of them widens the range of portfolios you can hold without being forced into a sale at a bad moment."]}]},{slug:"home-bias",title:"Home bias: the position nobody remembers taking",summary:"Almost every investor holds far more of their own market than it represents globally. It is usually an accident, and it is always a bet.",topic:"Diversification",readingMinutes:4,keyPoints:["The global market portfolio is roughly 64% United States, 12% Europe ex-UK, 10% emerging markets and 3% United Kingdom.","Holding more of your home market than that is a decision, whether or not it was made deliberately.","There are real arguments for some home bias \u2014 currency, tax, familiarity \u2014 and they justify a tilt, not a concentration."],sections:[{heading:"The starting point",paragraphs:["The market portfolio is what every investor collectively owns. It is not a recommendation; it is an accounting identity. If you hold 70% of your equities in one country that represents 3% of world market value, you have taken a large active position relative to that identity \u2014 and someone else is holding the other side of it.","This is the reason a gap analysis can be useful without giving advice. Comparing a portfolio to global market weights does not say what anyone should own. It says what they do own relative to what everyone owns, and leaves the interpretation to them."]},{heading:"Why it happens",paragraphs:["Home bias is rarely chosen. It accumulates: the companies you have heard of are listed at home, the index quoted on the news is the domestic one, the default fund in a workplace scheme is often home-weighted, and employer shares are home by definition. Each individual step is reasonable. The sum of them is a concentrated country bet."]},{heading:"The arguments for some of it",paragraphs:["Home bias is not automatically wrong. Your liabilities \u2014 rent, food, school fees \u2014 are in your home currency, and home assets match them without exchange-rate risk. Domestic funds can carry better tax treatment, and domestic dividends may avoid withholding tax. Costs are usually lower.","What these arguments support is a tilt of some tens of percentage points, sized deliberately. They do not support holding 80% of a portfolio in a market that is 3% of the world, which is what a UK or Australian investor discovers when they look through their holdings for the first time."]},{heading:"The subtler version",paragraphs:["Country weights are not the whole story. A UK investor holding only FTSE 100 companies has a portfolio of banks, oil, mining and consumer staples with almost no technology \u2014 so the country bet is also a large sector bet. Meanwhile many of those companies earn most of their revenue abroad, so the domestic exposure is less domestic than it looks. Looking at sector and revenue mix alongside the country label gives a truer picture than either on its own."]}]},{slug:"concentration",title:"The risk you are not paid to take",summary:"Markets compensate you for risk that cannot be diversified away. Single-company risk can be, so it is not compensated.",topic:"Diversification",readingMinutes:5,keyPoints:["Company-specific risk can be removed at no cost by holding more companies, so no premium is paid for bearing it.","Counting holdings overstates diversification: what matters is how uneven the weights are.","Concentration arrives through funds as well as directly, because index funds hold the same large companies."],sections:[{heading:"Two kinds of risk",paragraphs:["The risk in any single share splits into two parts. Some of it is shared with the whole market \u2014 recessions, interest rates, broad sentiment \u2014 and no amount of diversification removes it. The rest is specific to the company: a failed drug trial, an accounting problem, a lost contract. That part disappears as you add more companies, because individual surprises are not synchronised.","The consequence is uncomfortable but well established: since specific risk can be removed for free, the market does not pay a premium for carrying it. An investor holding one company instead of five hundred takes far more risk for the same expected return. That is the argument for diversification in a sentence, and it does not depend on any forecast."]},{heading:"Counting holdings is the wrong measure",paragraphs:["A portfolio of twenty shares where one is 40% of the value is not a twenty-stock portfolio in any way that matters. A more useful measure is effective holdings: one divided by the sum of squared weights. It answers how many equally sized positions would produce the same concentration. Twenty holdings with one at 40% might score around six.","This tool reports that figure through funds as well as directly, which is where most people get a surprise."]},{heading:"Concentration through the back door",paragraphs:["Index funds are weighted by market value, so the largest companies appear at the top of nearly every equity fund. Holding an S&P 500 fund, a Nasdaq-100 fund and a large-cap growth fund does not give three different exposures \u2014 it gives one exposure three times, with the same handful of companies at the top of each.","Add a direct holding in one of those same companies and the real weight can reach double digits without any single line on the statement looking large. The only way to see it is to add up holdings across every fund, which is what a look-through does."]},{heading:"What to do with a large position",paragraphs:["Nothing automatic. Concentration is how significant wealth is usually created, and cutting it lowers the top of the range as well as the bottom. A large holding with a big unrealised gain in a taxable account has a real, calculable cost to reducing. The point of measuring it is to make it a decision with a stated reason, rather than a drift that nobody noticed."]}]},{slug:"fund-overlap",title:"When two funds are really one",summary:"Overlapping funds add charges and lines to manage without adding diversification.",topic:"Diversification",readingMinutes:3,keyPoints:["Overlap is the share of value sitting in the same companies across two funds.","Above roughly 80%, a second fund is mostly a duplicate of the first.","Genuine reasons for two similar funds exist: domicile, currency hedging, distribution policy, account structure."],sections:[{heading:"How duplication happens",paragraphs:["Almost nobody sets out to hold two funds tracking the same index. It accumulates: a fund bought years ago at one broker, the same exposure bought later at another because it was the default, a provider switch that left the original in place, a workplace scheme that only offers one option. Each step made sense; the result is two lines doing one job.","The cost is small and permanent. Two sets of charges, two tracking differences, two positions to rebalance, and a portfolio that looks more diversified on the statement than it is in substance."]},{heading:"Measuring it",paragraphs:["Overlap between two funds is the sum, across every company, of the smaller of its two weights. Two identical funds score 100%. Two funds with no shared holdings score zero. An S&P 500 fund and a total US market fund typically score in the high eighties, because the extra companies in the total-market fund are small enough that they carry little weight.","Funds publish only their largest holdings, so any overlap figure from public data is an estimate. This tool blends the disclosed-holdings result with the structural similarity of the two funds and labels the result as an estimate, because treating it as precise would be misleading."]},{heading:"When two similar funds are justified",paragraphs:["Domicile and tax treatment can differ in ways that matter more than the fee. An accumulating fund and a distributing one behave differently in a taxable account. A hedged and an unhedged version of the same index are genuinely different instruments. And keeping one fund per account is sometimes simply easier to administer. The test is whether the difference is doing work, not whether the funds have different tickers."]}]},{slug:"costs",title:"The only input you know in advance",summary:"Returns are uncertain. Charges are not, and they compound against you in exactly the way returns compound for you.",topic:"Cost",readingMinutes:4,keyPoints:["An ongoing charge is deducted from the balance every year, so its effect grows with the portfolio.","Over decades, a difference of a few tenths of a percent becomes a meaningful share of the final balance.","Cost is not the only thing that matters: spread, tracking difference, fund size and tax treatment all affect what you keep."],sections:[{heading:"Why small numbers get large",paragraphs:["A 0.75% annual charge against a 0.05% one sounds like a rounding error. On \xA3100,000 growing at 5% a year for thirty years, the cheaper fund ends around \xA3427,000 and the dearer one around \xA3345,000. The \xA382,000 difference is not the fees paid \u2014 it is the fees plus everything those fees would have earned had they stayed invested.","This is the same compounding that makes long-horizon investing work, running in the opposite direction. It is also the reason cost matters most for the money you will hold longest."]},{heading:"Where to look first",paragraphs:["Sort holdings by value, not by fee. A tenth of a percent on the largest position is worth more than a full percent on the smallest. This is unintuitive, because the eye is drawn to the worst-looking number rather than the largest amount of money.","Then check what the charge is buying. A higher fee for a genuinely different exposure \u2014 small-cap value, an active strategy you specifically want \u2014 is a decision. A higher fee for the same index in a different wrapper is not buying anything."]},{heading:"The costs that are not in the headline figure",paragraphs:["The ongoing charge is the visible part. Bid-ask spread is paid on every trade and matters for smaller or less liquid funds. Tracking difference \u2014 how far the fund's return lags its index after everything \u2014 is sometimes larger than the stated fee, and sometimes smaller, because securities lending revenue can offset charges. Platform fees and commissions sit on top. For a fund held in a taxable account, the tax treatment of distributions can dwarf all of it."]}]},{slug:"sequence-risk",title:"Why the order of returns matters",summary:"Two portfolios with identical average returns can end in very different places, depending on when the bad years arrive.",topic:"Risk",readingMinutes:4,keyPoints:["When money is being added or withdrawn, the order of returns changes the outcome.","A fall just before money is needed is the damaging case, because there is no time to recover.","Holding the next few years of spending in stable assets is the standard defence."],sections:[{heading:"The arithmetic",paragraphs:["If nothing is added or withdrawn, the order of annual returns makes no difference \u2014 multiplication is commutative and the end value is the same. The moment money moves in or out, that stops being true. Withdrawing during a decline sells more units to raise the same amount, and those units are not there to recover.","The same effect works in your favour while saving: a long decline early in a savings life buys more units cheaply. The risk is specifically a fall near the point where the money is needed."]},{heading:"What it means in practice",paragraphs:["For someone twenty years from their goal, volatility is something to sit through, and the greater danger is holding too little in growth assets for too long. For someone two years out, the same volatility decides the outcome. The relevant question is not how likely a fall is, but what happens to the goal if one occurs in the final year.","Broad equity markets have fallen by more than a third several times in the past century, and have taken years to regain their previous level. This is not a tail scenario to be dismissed; it is a normal feature of the asset class."]},{heading:"The usual defences",paragraphs:["Hold the next two to three years of spending in cash and short-dated bonds, so a bad year is funded from the stable sleeve rather than by selling equities into a fall. Decide the glidepath in advance \u2014 a fixed share moved to short-dated assets each year \u2014 so the timing is not decided in the middle of a decline. And treat money with different dates as different problems, rather than averaging a house deposit and a pension into one allocation."]}]},{slug:"cash-drag",title:"Cash: safe over one year, expensive over twenty",summary:"Cash is the right home for money needed soon. Over a long horizon its safety becomes the cost.",topic:"Risk",readingMinutes:3,keyPoints:["Cash roughly tracks inflation over long periods, so purchasing power stands still.","Large cash balances usually reflect a pause rather than a decision.","Investing on a fixed schedule removes the need to pick a moment."],sections:[{heading:"What cash is for",paragraphs:["Two jobs, both important: the emergency buffer, and spending that is genuinely near-term. For both, the fact that the balance does not move is the entire point. No amount of expected return compensates for having to sell something at an uncertain price when the boiler fails."]},{heading:"Beyond that",paragraphs:["Once those two pots are funded, additional cash has a cost that does not appear on any statement. Over long periods cash has roughly kept pace with inflation, meaning purchasing power holds steady while invested money compounds. Over twenty years that gap is the difference between preserving money and growing it.","The usual reason for a large balance is not a decision but a pause \u2014 waiting for a better entry point, or simply not having got round to it. Both feel like caution and behave like a position."]},{heading:"Getting invested without picking a moment",paragraphs:["Investing a lump sum all at once has historically produced better average outcomes than spreading it, simply because markets rise more often than they fall. It also produces the worst regret if the timing is unlucky. Splitting the balance into fixed instalments on set dates gives up a little expected return in exchange for a plan you can actually follow. The version that fails is the one with no dates, where each instalment waits for conditions to look better."]}]},{slug:"emergency-buffer",title:"The buffer that makes everything else work",summary:"Without cash in front of the portfolio, the portfolio becomes the emergency fund.",topic:"Risk",readingMinutes:3,keyPoints:["Three to six months of essential spending is the usual starting range.","Job losses and market falls tend to arrive together, which is exactly the problem.","Access matters more than the interest rate."],sections:[{heading:"Why it comes first",paragraphs:["A long horizon only works if the money can be left alone. Without a buffer, an unexpected bill has to be met by selling investments \u2014 and the periods when people most often need money unexpectedly, because work is uncertain, are the periods when markets are most likely to be down. The buffer exists so that the worst moment to sell is never also the moment you are forced to."]},{heading:"How much",paragraphs:["Three months of essential spending is a common floor and six is a common target, but the number depends on how stable the income is. Two salaried earners in secure jobs might reasonably hold less; a single freelancer with variable income should hold more. Essential spending, not total spending \u2014 the figure you would need if you cut back."]},{heading:"Where to hold it",paragraphs:["Same-day or next-day access matters more than a few tenths of a percent in interest. An instrument that has to be sold at an uncertain price, or that takes a week to settle, is not performing the function. Money market funds and Treasury bill funds sit close to the line: usually fine, occasionally not, depending on how quickly your provider settles."]}]},{slug:"duration",title:"Duration: how much a bond moves when rates move",summary:"Roughly, a one-point rise in yields costs one percent of value for each year of duration.",topic:"Risk",readingMinutes:4,keyPoints:["Duration measures price sensitivity to interest rates, in years.","A long-duration bond fund can be as volatile as equities.","Matching duration to the horizon makes rate moves roughly self-cancelling."],sections:[{heading:"The rule of thumb",paragraphs:["A bond fund with a duration of six years loses roughly 6% of its value when yields rise by one percentage point, and gains roughly the same when they fall. A fund with a duration of seventeen years moves nearly three times as much. That is the whole of the mechanism, and it explains why 2022 was so painful for portfolios that held long bonds as their safe asset."]},{heading:"Why matching the horizon helps",paragraphs:["When yields rise, a bond's price falls but its future coupons are reinvested at the higher rate. Those two effects roughly offset at a horizon equal to the duration. Holding duration near your horizon therefore makes you close to indifferent to rate moves \u2014 which is the point of a defensive sleeve.","Holding a long-duration fund for a short goal is a bet on rates falling, whatever the label on the fund says. Sometimes that bet is intended. Often it was made because long bonds had the highest yield on the list."]},{heading:"The equity-drawdown argument",paragraphs:["Long government bonds have historically been the asset most likely to rise sharply during an equity crash, because central banks cut rates in recessions. That is a real benefit and the main case for holding more duration than your horizon suggests. It is also not guaranteed: in an inflation shock, equities and long bonds can fall together, as they did in 2022."]}]},{slug:"credit-risk",title:"High yield is not the defensive part",summary:"Sub-investment-grade bonds behave more like equity than like ballast, and they do it at the worst time.",topic:"Risk",readingMinutes:3,keyPoints:["High-yield bonds pay more because issuers can default.","They fall alongside equities, because the same conditions drive both.","Counting them as bonds overstates how defensive a portfolio is."],sections:[{heading:"What the extra yield is for",paragraphs:["A high-yield bond pays more than a government bond because there is a real chance the issuer cannot pay. That compensation is not free money; over a full cycle it approximately pays for the defaults that occur, with something left over for the risk. The problem is not the long-run return. It is when the losses arrive."]},{heading:"The correlation problem",paragraphs:["Defaults cluster in recessions, which is precisely when equities fall. So the asset held to cushion an equity drawdown drops at the same time. Statistically high yield has behaved closer to equity than to government bonds during stress periods, which means a portfolio holding it as its defensive sleeve is more exposed to equity-like risk than the asset-class labels suggest.","The practical fix is not necessarily to dispose of the holding. It is to count it in the growth sleeve rather than the defensive one, so the portfolio's actual risk is visible."]}]},{slug:"income-vs-total-return",title:"Income and capital are the same money",summary:"A portfolio that pays less than you need is not broken. Selling units is a legitimate way to spend it.",topic:"Income",readingMinutes:4,keyPoints:["A dividend transfers value out of the share price; it does not create value.","Total-return spending funds withdrawals from income and sales together.","Reaching for yield changes what the portfolio holds, usually toward a few sectors."],sections:[{heading:"Where a dividend comes from",paragraphs:["When a company pays a dividend, cash leaves the business and the share price adjusts down by roughly the same amount. The shareholder is no better off at the moment of payment than before it \u2014 value moved from one pocket to another. This is not an argument against dividends, which are a sensible way for mature companies to return cash. It is an argument against treating dividend income as free money that capital gains are not."]},{heading:"Spending a portfolio",paragraphs:["A total-return approach treats income and capital as one pool and funds withdrawals from whichever is more convenient. Where income covers the need, spend it. Where it does not, sell units. The question that actually matters is not where the cash comes from but what gets sold in a bad year \u2014 and the standard answer is to hold two to three years of spending in stable assets so that nothing has to be sold into a decline."]},{heading:"The cost of chasing yield",paragraphs:["Building a portfolio to produce a target yield changes what it holds. High-yield equity screens concentrate into utilities, telecoms, energy and mature consumer names, and away from most of the technology sector. That is a real sector bet taken for the sake of a cash-flow pattern that selling units would have produced anyway. In a taxable account it can also be worse after tax than a capital gain."]}]},{slug:"dividend-traps",title:"A high yield is often a falling price",summary:"Yield is a ratio. It rises when the dividend rises, and it rises when the price falls.",topic:"Income",readingMinutes:3,keyPoints:["A high yield combined with a high payout ratio is the shape of a dividend under strain.","Check free cash flow cover and leverage, not just the yield.","Sector context matters: utilities and REITs run high payouts by design."],sections:[{heading:"Reading the ratio correctly",paragraphs:["Dividend yield is the annual dividend divided by the price. A yield that has risen from 3% to 7% usually means the price halved, not that the payout doubled \u2014 and the market marked the price down for a reason, often because it expects the dividend to be cut."]},{heading:"What to check instead",paragraphs:["The payout ratio says how much of earnings is already committed. Above roughly 80% there is little room for a weak year. Free cash flow cover is stronger still, because it asks whether the cash actually exists after capital spending rather than whether accounting earnings do. Net debt to EBITDA matters because a levered company facing a shortfall pays its lenders first and its shareholders last.","A dividend cut typically takes the share price with it, so the income investor loses twice. That is what makes the combination worth checking before the yield is relied on."]},{heading:"The sector caveat",paragraphs:["Regulated utilities and REITs distribute most of their cash flow by design and by law respectively, so a high payout ratio is normal rather than alarming. Compare a company with its own sector before drawing a conclusion from any of these numbers."]}]},{slug:"currency-risk",title:"Owning a foreign company means owning its currency",summary:"Over decades currency moves have tended to wash out. Over a few years they can swamp the underlying return.",topic:"Risk",readingMinutes:3,keyPoints:["Unhedged foreign holdings carry exchange-rate risk on top of asset risk.","For equities over long horizons, most investors leave it unhedged; hedging costs money.","For bonds, currency moves can be several times the yield, so hedged versions are the norm."],sections:[{heading:"The two exposures",paragraphs:["Buying a US-listed fund as a UK investor gives two positions: the companies, and the dollar. If the companies gain 10% and the dollar falls 10% against sterling, the sterling return is close to zero. Nothing went wrong with the investment thesis; the second position simply moved the other way."]},{heading:"Why equities are usually left unhedged",paragraphs:["Over long horizons, currency pairs have tended to mean-revert rather than trend indefinitely, so the effect washes out somewhat. Hedging costs the interest-rate differential between the two currencies, which can be substantial and is paid every year regardless of what happens. And large multinational companies already have revenue in many currencies, so the listing currency overstates the true exposure."]},{heading:"Why bonds usually are hedged",paragraphs:["The calculation reverses for bonds. A 3% yield against a currency that can move 10% in a year means the currency dominates the return entirely \u2014 you would be holding a foreign exchange position with a small coupon attached. This is why international bond funds are overwhelmingly sold in currency-hedged form, and why an unhedged one deserves a second look."]}]},{slug:"factor-tilts",title:"Factor tilts are decade-long positions",summary:"If you cannot hold a tilt through ten bad years, the tilt will cost you rather than pay you.",topic:"Diversification",readingMinutes:4,keyPoints:["Factor premia, where they exist, show up over decades and disappear for years at a time.","The main risk is abandoning the tilt after a bad stretch, which converts a long-run bet into a realised loss.","Tilts often accumulate accidentally from funds bought for other reasons."],sections:[{heading:"What a factor is",paragraphs:["A factor is a characteristic shared by a group of companies that has historically been associated with different returns: cheapness relative to book value or earnings, profitability, recent price strength, small size, low volatility. Funds built around them are widely available and cheap compared with traditional active management."]},{heading:"The honest version of the evidence",paragraphs:["The historical record is real but weaker than the marketing. Premia are measured over many decades, they vary by market and period, some have shrunk since publication, and every one of them has endured stretches of underperformance long enough to exhaust most investors' patience. Value spent most of the 2010s losing to growth.","That does not make tilts unreasonable. It makes them a commitment with a horizon attached, which should be written down when the position is taken rather than reconstructed during a bad year."]},{heading:"Accidental tilts",paragraphs:["Most factor exposure in retail portfolios was never chosen. A technology fund plus a large-cap growth fund plus a few well-known names produces a large growth and momentum tilt without anyone deciding on one. The first step is measuring what is already there; deciding what it should be comes second."]}]},{slug:"size-and-style",title:"Size and style: the shape underneath the labels",summary:"A portfolio built from a large-cap index and a few familiar names usually holds almost nothing outside the largest companies.",topic:"Diversification",readingMinutes:3,keyPoints:["Large caps are around 72% of global market value, mid caps 19% and small caps 9%.","Style splits roughly into thirds: value, blend and growth.","Deviations from those shares are positions, whether or not they were chosen."],sections:[{heading:"Where the gap usually appears",paragraphs:["Mid caps are the most commonly missing slice. An S&P 500 fund covers large caps; a small-cap fund covers the bottom; the middle is left out unless something specifically covers it. Since mid caps are a fifth of market value, that is a meaningful hole to leave by accident."]},{heading:"Style is a description, not a verdict",paragraphs:["Growth companies are priced on expected future earnings rather than current ones, which makes them more sensitive to interest rates and to disappointment. Value companies are cheap on accounting measures, often for identifiable reasons. Neither is better; they behave differently, and a portfolio heavily weighted to one has made a bet on which environment arrives."]}]},{slug:"sector-concentration",title:"Sector weights drift on their own",summary:"A sector that performs well becomes a larger share of the portfolio without anyone deciding anything.",topic:"Diversification",readingMinutes:3,keyPoints:["Market-cap weighting means winners automatically grow into larger positions.","Sector funds are concentrated by construction: some hold fewer than 30 companies.","Look-through is the only way to see the true weight across several funds."],sections:[{heading:"Drift is the default",paragraphs:["In a market-cap-weighted index, a sector that doubles while the rest stands still doubles its weight. Nothing was bought and no decision was made, but the portfolio's exposure has changed materially. This is how information technology grew from a fifth to roughly a third of the US market without most holders adjusting anything.","This is not a flaw in index investing \u2014 it is how the index reflects the market. It does mean that leaving a portfolio alone is itself a choice with consequences."]},{heading:"Sector funds are concentrated instruments",paragraphs:["A sector ETF sounds diversified because it is a fund. Many hold fewer than forty companies, and the largest few can be half the fund. An energy sector fund with 40% in two companies is closer to a pair of direct holdings than to a diversified position, and should be sized accordingly."]}]},{slug:"balance-sheets",title:"Debt removes options",summary:"Leverage magnifies both directions, and it decides what a company can do in a bad year.",topic:"Company analysis",readingMinutes:4,keyPoints:["Net debt to EBITDA says how much debt there is; interest cover says whether it is affordable.","Above roughly three times EBITDA, lenders typically start attaching conditions.","Refinancing dates matter: debt taken out cheaply has to be replaced at today's rates."],sections:[{heading:"Two numbers, two questions",paragraphs:["Net debt to EBITDA compares borrowings, less cash, with annual operating cash generation. It answers how many years of earnings the debt represents. Interest cover \u2014 operating profit divided by interest expense \u2014 answers whether the payments are comfortably affordable right now. A company can look heavily indebted on the first measure and perfectly safe on the second if its borrowing is cheap and long-dated."]},{heading:"What debt actually costs you",paragraphs:["The visible cost is interest. The larger cost is lost flexibility. A levered company facing a weak year must service its debt before anything else, so the dividend gets cut, capital spending gets deferred, and in the worst case shares get issued at depressed prices \u2014 diluting existing holders at precisely the wrong moment. An unlevered competitor can spend through the downturn and take market share."]},{heading:"Sector context",paragraphs:["Utilities, REITs and telecoms carry high leverage by design, because their cash flows are stable and often regulated. Banks cannot be assessed on these measures at all \u2014 leverage is their business model, and they are analysed on capital ratios instead. Comparing a company with its own sector is the only way to read these numbers usefully."]},{heading:"The maturity wall",paragraphs:["Debt issued when rates were near zero has to be refinanced at whatever rates prevail when it matures. A company with comfortable interest cover today and a large maturity next year may not have comfortable cover the year after. The maturity schedule is in the annual report and is one of the more useful things to read in it."]}]},{slug:"valuation-basics",title:"What a multiple actually tells you",summary:"A high multiple is not a forecast of poor returns. It is a statement about how much future growth is already in the price.",topic:"Company analysis",readingMinutes:4,keyPoints:["A multiple describes expectations, not quality.","Free cash flow is harder to flatter than accounting earnings.","Cheap and good value are different things \u2014 companies are often cheap for identifiable reasons."],sections:[{heading:"The multiple is the expectation",paragraphs:["A company trading at 40 times earnings is not necessarily expensive, and one at 8 times is not necessarily cheap. The multiple says what the market already expects. At 40 times, substantial growth has to arrive simply for the shares to hold their value \u2014 growing well is not enough, because growing well is already priced. At 8 times, the market expects decline, and merely stabilising can be enough to do well."]},{heading:"Why cash flow beats earnings",paragraphs:["Accounting earnings involve judgement: depreciation schedules, revenue recognition, provisions, the treatment of acquisitions. Free cash flow \u2014 cash from operations less capital spending \u2014 is harder to shape, because it either arrived in the bank or it did not. Where the two diverge persistently, the divergence is usually the most interesting thing about the company.","Free cash flow yield, which is free cash flow divided by market value, is also directly comparable across companies with different capital structures and tax positions in a way that P/E is not."]},{heading:"Cheap is not the same as good value",paragraphs:["Screens find cheap companies reliably. Most are cheap for reasons a screen cannot see: structural decline, an unsustainable margin, a legal overhang, an accounting question. The valuation score in this tool ranks companies against a fixed scale of ratios and nothing else \u2014 it is a starting point for reading the accounts, not a conclusion drawn from them."]}]}],xn=new Map(Ie.map(e=>[e.slug,e]));function At(e){return xn.get(e)}var Tn=[1,1.25,1.5,2,2.5,3,4,5,6,8,10];function Rn(e){if(e<=0)return 1;let t=10**Math.floor(Math.log10(e)),n=e/t;return(Tn.find(a=>n<=a+1e-9)??10)*t}function An(e,t){let n=re[t],i=Math.abs(e),a=i>=1e9?["B",1e9]:i>=1e6?["M",1e6]:i>=1e3?["K",1e3]:["",1],s=i/a[1],o=s<10&&s%1!==0?1:0;return`${n}${s.toFixed(o)}${a[0]}`}function Ut(e,t="USD",n=640,i=260){let a={left:56,top:14,right:12,bottom:26},s=Math.max(1,n-a.left-a.right),o=Math.max(1,i-a.top-a.bottom),l=Math.max(1,e.length-1),r=e.reduce((b,M)=>Math.max(b,M.p90,M.contributed),0)*1.02,c=Rn(r/4),d=c*Math.max(1,Math.ceil(r/c)),h=b=>a.left+b/l*s,m=b=>a.top+o-Math.min(b,d)/d*o,g=b=>e.map((M,he)=>`${he===0?"M":"L"}${h(M.year).toFixed(1)},${m(b(M)).toFixed(1)}`).join(" "),f=e.map((b,M)=>`${M===0?"M":"L"}${h(b.year).toFixed(1)},${m(b.p90).toFixed(1)}`).join(" "),S=e.slice().reverse().map(b=>`L${h(b.year).toFixed(1)},${m(b.p10).toFixed(1)}`).join(" "),E=[];for(let b=0;b<=d+1e-6;b+=c)E.push({value:b,y:m(b),label:An(b,t)});let A=l<=10?2:l<= <script>
(function () {
  "use strict";
  var G = window.GaplineCore;
  var app = document.getElementById("app");
  var STORE = "gapline.artifact.v1";

  /* ------------------------------------------------------------------ state */

  var SAMPLE = [
    { symbol: "VOO", value: 42000 }, { symbol: "QQQ", value: 26000 },
    { symbol: "SPY", value: 14000 }, { symbol: "NVDA", value: 11000 },
    { symbol: "AAPL", value: 9000 }, { symbol: "MSFT", value: 7000 },
    { symbol: "SCHD", value: 6000 }, { symbol: "BND", value: 5000 }
  ];

  var DEFAULT_PROFILE = {
    baseCurrency: "USD", homeRegion: "us", goal: "retirement", horizonYears: 22,
    riskTolerance: 3, monthlyContribution: 800, emergencyFundMonths: 4,
    monthlyEssentialSpend: 2800, incomeNeedRate: 0, taxWrapper: "mixed", homeBiasAllowancePp: 0
  };

  var state = {
    view: "reference", holdings: SAMPLE.slice(), cash: 8000, isSample: true,
    profile: Object.assign({}, DEFAULT_PROFILE),
    growthOverride: null, accepted: false,
    presetId: "msciWorld", bondShare: null, projReturn: null, showRest: false,
    open: {}, expTab: "region", detail: null, article: null,
    screen: { q: "", kind: "all", sector: "all", sort: "size", limit: 30 }
  };

  try {
    var saved = JSON.parse(localStorage.getItem(STORE) || "null");
    if (saved) {
      state = Object.assign(state, saved);
      state.profile = Object.assign({}, DEFAULT_PROFILE, saved.profile || {});
      state.screen = Object.assign(state.screen, saved.screen || {});
      state.open = {};
    }
  } catch (e) { /* private mode, or blocked site data: run without persistence */ }

  function save() {
    try {
      localStorage.setItem(STORE, JSON.stringify({
        holdings: state.holdings, cash: state.cash, isSample: state.isSample,
        profile: state.profile, growthOverride: state.growthOverride,
        accepted: state.accepted, view: state.view, screen: state.screen,
        presetId: state.presetId, bondShare: state.bondShare, projReturn: state.projReturn
      }));
    } catch (e) { /* nothing to do: the session still works, it just will not be remembered */ }
  }

  /* --------------------------------------------------------------- helpers */

  function esc(v) {
    return String(v == null ? "" : v).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  var pct = G.formatPercent, pp = G.formatPp, lab = G.label;
  function cur(v, d) { return G.formatCurrency(v, state.profile.baseCurrency, d || 0); }
  var PALETTE = ["var(--c1)", "var(--c2)", "var(--c3)", "var(--c4)", "var(--c5)", "var(--c6)", "var(--c7)", "var(--c8)"];

  var reportCache = { key: null, value: null };
  function report() {
    var key = JSON.stringify([state.holdings, state.cash, state.profile, state.growthOverride,
      state.presetId, state.bondShare, state.projReturn]);
    if (reportCache.key !== key) {
      var portfolio = G.buildPortfolio(state.holdings, {
        cash: state.cash, baseCurrency: state.profile.baseCurrency, totalValueHint: 0
      });
      var overrides = { presetId: state.presetId };
      if (state.bondShare != null) overrides.bondShare = state.bondShare;
      else if (state.growthOverride != null) overrides.growthShare = state.growthOverride;
      var projOverrides = state.projReturn == null ? {} : { realReturn: state.projReturn };
      reportCache = {
        key: key,
        value: G.analysePortfolio(portfolio, state.profile, {
          referenceOverrides: overrides, projectionOverrides: projOverrides
        })
      };
    }
    return reportCache.value;
  }

  function stackedBar(slices) {
    var total = slices.reduce(function (a, s) { return a + s.value; }, 0);
    if (total <= 0) return "";
    var segs = slices.map(function (s, i) {
      return '<div style="width:' + ((s.value / total) * 100).toFixed(3) + "%;background:" + PALETTE[i % 8] + '"></div>';
    }).join("");
    var legend = slices.map(function (s, i) {
      return '<span class="legend-item"><i class="swatch" style="background:' + PALETTE[i % 8] + '"></i>' +
        esc(s.label) + ' <span class="legend-v">' + pct(s.value / total) + "</span></span>";
    }).join("");
    return '<div class="bar" role="img" aria-label="' +
      esc(slices.map(function (s) { return s.label + " " + pct(s.value / total); }).join(", ")) +
      '">' + segs + '</div><div class="legend">' + legend + "</div>";
  }


  /**
   * A part-to-whole pie. Identity comes from the legend, which carries every
   * label and value as text — wedge fills vary in lightness, so no single text
   * colour would be legible inside all of them.
   */
  function pieChart(title, slices, size) {
    size = size || 168;
    var pie = G.buildPie(slices, size, PALETTE.length);
    if (!pie.wedges.length) return "";
    var wedges = pie.wedges.map(function (w) {
      return '<path d="' + w.path + '" fill="' + PALETTE[w.colorIndex % PALETTE.length] +
        '" stroke="var(--surface)" stroke-width="2" stroke-linejoin="round">' +
        "<title>" + esc(w.label) + " — " + pct(w.share) + "</title></path>";
    }).join("");
    var legend = pie.wedges.map(function (w) {
      return '<li style="display:flex;align-items:baseline;gap:8px;font-size:12px">' +
        '<i class="swatch" style="background:' + PALETTE[w.colorIndex % PALETTE.length] + ';margin-top:1px"></i>' +
        '<span style="flex:1;color:var(--muted)">' + esc(w.label) + "</span>" +
        '<span class="num" style="font-weight:500">' + pct(w.share) + "</span></li>";
    }).join("");
    return '<figure style="margin:0"><figcaption class="eyebrow">' + esc(title) + "</figcaption>" +
      '<div style="display:flex;flex-wrap:wrap;align-items:center;gap:16px 24px;margin-top:12px">' +
      '<svg viewBox="0 0 ' + pie.size + " " + pie.size + '" width="' + size + '" height="' + size +
      '" role="img" aria-label="' + esc(title + ": " + pie.wedges.map(function (w) { return w.label + " " + pct(w.share); }).join(", ")) +
      '" style="flex:none;max-width:100%">' + wedges + "</svg>" +
      '<ul style="list-style:none;margin:0;padding:0;min-width:9rem;flex:1;display:flex;flex-direction:column;gap:4px">' +
      legend + "</ul></div>" +
      (pie.folded ? '<p style="margin-top:8px;font-size:11px;color:var(--faint)">The smallest categories are grouped as \u201cOther\u201d — there are eight distinguishable colours, and reusing one would make two different things look the same.</p>' : "") +
      "</figure>";
  }

  function gapTable(rows, threshold) {
    var max = Math.max.apply(null, rows.map(function (r) { return Math.max(r.current, r.reference); }).concat([0.01]));
    var body = rows.map(function (r) {
      var delta = r.current - r.reference;
      var material = Math.abs(delta) >= threshold;
      var tone = !material ? "var(--c8)" : delta > 0 ? "var(--over)" : "var(--under)";
      return '<tr><td class="gap-label">' + esc(r.label) + "</td>" +
        '<td><div class="gap-track"><div class="gap-fill" style="width:' + ((r.current / max) * 100).toFixed(2) +
        "%;background:" + tone + '"></div>' +
        (r.reference > 0 ? '<div class="gap-tick" style="left:calc(' + ((r.reference / max) * 100).toFixed(2) + '% - 1px)" title="Reference ' + pct(r.reference) + '"></div>' : "") +
        "</div></td>" +
        '<td class="gap-val">' + pct(r.current) + "</td>" +
        '<td class="gap-delta" style="color:' + (r.reference > 0 ? tone : "var(--faint)") + '">' +
        (r.reference > 0 ? pp(delta) : "—") + "</td></tr>";
    }).join("");
    return '<table class="gap"><caption class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Your weight against the reference weight</caption><tbody>' + body + "</tbody></table>";
  }

  function pillFor(direction) { return direction === "over" ? "over" : direction === "under" ? "under" : ""; }

  var CATEGORY = {
    allocation: "Allocation", concentration: "Concentration", overlap: "Duplication",
    cost: "Cost", factor: "Tilt", income: "Income", horizon: "Horizon",
    currency: "Currency", quality: "Company quality", liquidity: "Liquidity", structure: "Structure"
  };

  /* ----------------------------------------------------------------- views */

  function candidateTable(screen) {
    var rows = screen.symbols.map(G.lookupSecurity).filter(function (s) { return s && s.kind === "etf"; });
    if (!rows.length) return "";
    return '<div class="note"><strong>Screen used:</strong> ' + esc(screen.description) +
      " These are filter results, not a shortlist — check each one against your own account, wrapper and country." +
      '</div><div class="card scroll" style="margin-top:8px"><table class="data"><thead><tr>' +
      "<th>Fund</th><th class=\"r\">Charge</th><th class=\"r\">Size</th><th class=\"r\">Spread</th><th>Structure</th>" +
      "</tr></thead><tbody>" + rows.map(function (s) {
        return "<tr><td><button class=\"row-link sym\" data-act=\"detail\" data-symbol=\"" + esc(s.symbol) + "\">" + esc(s.symbol) +
          '</button><div style="font-size:11.5px;color:var(--muted)">' + esc(s.name) + "</div></td>" +
          '<td class="r num">' + pct(s.fund.expenseRatio, 2) + "</td>" +
          '<td class="r num" style="color:var(--muted)">' + G.formatCompactCurrency(s.fund.aumUsd, "USD") + "</td>" +
          '<td class="r num" style="color:var(--muted)">' + pct(s.fund.spread, 3) + "</td>" +
          '<td style="font-size:11.5px;color:var(--muted)">' + esc(s.fund.domicile) + " · " + esc(lab(s.fund.distribution)) +
          (s.fund.currencyHedged ? " · hedged" : "") + "</td></tr>";
      }).join("") + "</tbody></table></div>";
  }

  function findingCard(f) {
    var open = !!state.open[f.id];
    var tone = pillFor(f.direction);
    var head = '<button class="finding-head" data-act="toggle" data-id="' + esc(f.id) + '" aria-expanded="' + open + '">' +
      '<span class="rank ' + tone + '">' + f.severity + "</span>" +
      '<span style="min-width:0;flex:1">' +
      '<span style="display:flex;flex-wrap:wrap;gap:8px;align-items:center">' +
      '<span class="pill ' + tone + '">' + esc(CATEGORY[f.category] || f.category) + "</span>" +
      '<span class="finding-title">' + esc(f.title) + "</span></span>" +
      '<span class="finding-sum" style="display:block">' + esc(f.summary) + "</span></span>" +
      '<span class="finding-cue">' + (open ? "Hide" : "Detail") + "</span></button>";
    if (!open) return '<article class="finding">' + head + "</article>";

    var ev = '<div><div class="eyebrow">The numbers</div><div class="ev" style="margin-top:10px">' +
      f.evidence.map(function (e) {
        return '<div class="ev-item"><div class="ev-k">' + esc(e.label) + '</div><div class="ev-v">' + esc(e.value) + "</div>" +
          (e.detail ? '<div class="ev-d">' + esc(e.detail) + "</div>" : "") + "</div>";
      }).join("") + "</div></div>";

    var why = '<div><div class="eyebrow">Why this measure matters</div>' +
      '<p style="margin-top:8px;font-size:13px;color:var(--muted)">' + esc(f.why) + "</p>" +
      (f.learnSlug ? '<p style="margin-top:8px"><button class="row-link" data-act="article" data-slug="' + esc(f.learnSlug) +
        '" style="color:var(--accent-ink);font-size:12.5px;font-weight:600;text-decoration:none">Read more on this →</button></p>' : "") + "</div>";

    var impl = "";
    if (f.implementation) {
      var im = f.implementation;
      impl = '<div class="stack-s"><div><div class="eyebrow">Ways this gap could be closed</div>' +
        '<p style="margin-top:8px;font-size:13px;font-weight:600">' + esc(im.objective) + "</p>" +
        (im.gapValue != null ? '<p class="num" style="font-size:12.5px;color:var(--muted);margin-top:3px">Size of the gap: ' + cur(im.gapValue) + "</p>" : "") +
        "</div>" +
        im.routes.map(function (r) {
          return '<div class="route"><div class="route-k">' + esc(r.label) + '</div><div class="route-d">' + esc(r.detail) + "</div></div>";
        }).join("") +
        (im.screen ? candidateTable(im.screen) : "") +
        (im.tradeoffs.length ? '<div class="note"><strong>What you give up either way</strong><ul class="bullets" style="margin-top:6px">' +
          im.tradeoffs.map(function (t) { return "<li>" + esc(t) + "</li>"; }).join("") + "</ul></div>" : "") +
        "</div>";
    }
    return '<article class="finding">' + head + '<div class="finding-body">' + ev + why + impl + "</div></article>";
  }


  function projectionPanel(r) {
    var pj = r.projection, c = G.buildFanChart(pj.points, state.profile.baseCurrency, 640, 260);
    var grid = c.yTicks.map(function (tk) {
      return '<line x1="' + c.plot.left + '" x2="' + (c.width - c.plot.right) + '" y1="' + tk.y.toFixed(1) +
        '" y2="' + tk.y.toFixed(1) + '" stroke="var(--line)" stroke-width="1"></line>' +
        '<text x="' + (c.plot.left - 8) + '" y="' + (tk.y + 3.5).toFixed(1) +
        '" text-anchor="end" font-size="10" fill="var(--faint)" font-family="var(--mono)">' + esc(tk.label) + "</text>";
    }).join("");
    var xlab = c.xTicks.map(function (tk) {
      return '<text x="' + tk.x.toFixed(1) + '" y="' + (c.height - 8) +
        '" text-anchor="middle" font-size="10" fill="var(--faint)" font-family="var(--mono)">' + esc(tk.label) + "</text>";
    }).join("");
    var years = pj.assumptions.years;
    var step = Math.max(1, Math.round(years / 6));
    var tableRows = pj.points.filter(function (pt) { return pt.year % step === 0 || pt.year === years; }).map(function (pt) {
      return "<tr><td>" + (pt.year === 0 ? "Today" : pt.year + "y") + "</td>" +
        '<td class="r" style="color:var(--muted)">' + cur(pt.contributed) + "</td>" +
        '<td class="r">' + cur(pt.p10) + "</td>" +
        '<td class="r" style="font-weight:500">' + cur(pt.p50) + "</td>" +
        '<td class="r">' + cur(pt.p90) + "</td></tr>";
    }).join("");

    return '<section class="card pad"><h2 class="sec-title">What the ' + esc(r.reference.presetLabel) +
      ' reference mix has historically ranged between</h2>' +
      '<p class="sub" style="margin-top:4px">A simulation of 2,000 paths, in today\u2019s money. It is not a forecast, and it illustrates the reference model rather than the holdings you actually own.</p>' +

      '<div class="grid3" style="margin-top:16px">' +
      '<div><div class="stat-k">Lower edge — 1 path in 10 below</div><div class="stat-v t-over">' + cur(pj.final.p10) + "</div></div>" +
      '<div><div class="stat-k">Middle outcome</div><div class="stat-v">' + cur(pj.final.p50) + "</div></div>" +
      '<div><div class="stat-k">Upper edge — 1 path in 10 above</div><div class="stat-v t-under">' + cur(pj.final.p90) + "</div></div>" +
      "</div>" +
      '<p class="sub" style="margin-top:8px">After ' + years + " years, against " + cur(pj.final.contributed) + " of your own money paid in.</p>" +

      '<figure style="margin:18px 0 0"><svg id="fan" viewBox="0 0 ' + c.width + " " + c.height +
      '" width="100%" role="img" aria-label="Projected range for the reference mix over ' + years + " years, from " +
      esc(cur(pj.final.p10)) + " to " + esc(cur(pj.final.p90)) + ' in today\u2019s money." style="display:block;max-width:100%;touch-action:none">' +
      grid + xlab +
      '<path d="' + c.bandPath + '" fill="var(--accent)" fill-opacity="0.16"></path>' +
      '<path d="' + c.contributedPath + '" fill="none" stroke="var(--faint)" stroke-width="2" stroke-dasharray="4 4"></path>' +
      '<path d="' + c.medianPath + '" fill="none" stroke="var(--accent)" stroke-width="2"></path>' +
      '<line id="xhair" x1="0" x2="0" y1="' + c.plot.top + '" y2="' + (c.height - c.plot.bottom) +
      '" stroke="var(--line-strong)" stroke-width="1" opacity="0"></line>' +
      '<circle id="xdot" r="4" fill="var(--accent)" stroke="var(--surface)" stroke-width="2" opacity="0"></circle>' +
      "</svg>" +
      '<figcaption style="display:flex;flex-wrap:wrap;gap:6px 20px;align-items:center;margin-top:12px;font-size:11.5px;color:var(--muted)">' +
      '<span class="legend-item"><i class="swatch" style="background:var(--accent);opacity:.26;width:14px;height:10px"></i>10th–90th percentile</span>' +
      '<span class="legend-item"><i style="width:16px;height:2px;background:var(--accent)"></i>Median path</span>' +
      '<span class="legend-item"><i style="width:16px;height:2px;background:var(--faint)"></i>Money paid in</span>' +
      '<span id="readout" class="num" style="margin-left:auto">At ' + years + " years: " + cur(pj.final.p10) +
      " – " + cur(pj.final.p90) + ", middle " + cur(pj.final.p50) + "</span></figcaption></figure>" +

      '<div class="grid2" style="margin-top:20px;padding-top:16px;border-top:1px solid var(--line)">' +
      '<label class="field"><span class="field-k">Real return assumption: ' + pct(pj.assumptions.realReturn) + " a year</span>" +
      '<span class="field-h">' + esc(r.reference.presetLabel) +
      ' blended with the bond sleeve at this model\u2019s weights, on long-run historical figures. After inflation. Change it and the whole range moves.</span>' +
      '<input type="range" id="projret" data-act="projret" min="0" max="10" step="0.1" value="' +
      (Math.round(pj.assumptions.realReturn * 1000) / 10) + '" aria-label="Real return assumption">' +

  function statTile(k, v, d, tone) {
    return '<div class="stat"><div class="stat-k">' + esc(k) + "</div>" +

  function exposureRows(r, tab) {
    var ex = r.metrics.exposure;
    if (tab === "currency") {
      return Object.keys(ex.currency).filter(function (c) { return ex.currency[c] > 0.004; })
        .sort(function (a, b) { return ex.currency[b] - ex.currency[a]; })
        .map(function (c) {
          return { label: c === state.profile.baseCurrency ? c + " (your spending currency)" : c, current: ex.currency[c], reference: 0 };
        });
    }
    if (tab === "style") {
      var cs = G.normaliseSleeve(ex.style, G.STYLE_BUCKETS);
      var market = { value: 0.31, blend: 0.38, growth: 0.31 };
      return G.STYLE_BUCKETS.map(function (k) { return { label: lab(k), current: cs[k], reference: market[k] }; });
    }
    var keys = tab === "region" ? G.REGIONS : tab === "sector" ? G.SECTORS : G.SIZE_BUCKETS;
    var c = G.normaliseSleeve(ex[tab], keys), ref = G.normaliseSleeve(r.reference[tab], keys);
    return keys.map(function (k) { return { label: lab(k), current: c[k] || 0, reference: ref[k] || 0 }; })
      .sort(function (a, b) { return b.current - a.current; });
  }

  var EXP_TABS = [

    ["size", "Company size", "Large, mid and small at global market weights. Mid caps are the slice most often missing."],
    ["style", "Style", "Value, blend and growth. The market splits roughly into thirds."],
    ["currency", "Currency", "What your money is actually exposed to, against the currency you will spend in."]
  ];

  function viewReport() {

      '<header><h1 style="font-size:24px">Gap report</h1>' +

      statTile("Largest company", pct(m.diversification.topHoldingWeight), names.length ? names[0].name : "—", m.diversification.topHoldingWeight > 0.08 ? "t-over" : "") +

      statTile("Distribution yield", pct(ex.yield), r.profile.incomeNeedRate > 0 ? "Against " + pct(r.profile.incomeNeedRate) + " drawn" : "No withdrawals stated") +
      statTile("Bond duration", ex.duration > 0 ? ex.duration.toFixed(1) + "y" : "—", "Reference " + ref.targetDuration.toFixed(1) + "y") +
      statTile("Findings", String(r.findings.length), "Ranked by how much of the portfolio each touches") +

      '<div style="margin-top:12px">' + gapTable(exposureRows(r, state.expTab), state.expTab === "size" ? 0.08 : state.expTab === "sector" ? 0.06 : 0.05) + "</div>" +
      '<p style="font-size:11.5px;color:var(--faint);margin-top:10px;display:flex;align-items:center;gap:8px">' +
      '<i style="display:inline-block;width:2px;height:12px;background:var(--ink)"></i>The tick mark is the reference weight.</p></section>' +

      '<div class="cols">' +
      '<section class="card pad"><h2 class="sec-title">Largest companies, counted through funds</h2>' +
      '<p class="sub" style="margin-top:4px">Direct holdings and fund holdings added together.</p>' +
      '<table class="data" style="margin-top:12px"><tbody>' + names.map(function (n) {
        return '<tr><td style="padding-left:0"><div style="font-weight:500">' + esc(n.name) + "</div>" +

      '<p style="font-size:11.5px;color:var(--faint);margin-top:10px">Funds publish only their largest holdings, so companies outside every fund’s disclosed list do not appear here. The concentration figures above account for that remainder; this table does not.</p></section>' +

      '<section class="card pad"><h2 class="sec-title">The reference model</h2>' +

    }).join("");

    var cashRow = state.cash > 0 ? '<tr style="background:var(--surface-2)"><td><strong>Cash</strong>' +

    var unresolved = r.portfolio.unresolved.length

      '<button class="btn sec" data-act="paste" data-mode="add">Add to existing</button></div>' +
      (state.pasteErrors && state.pasteErrors.length
        ? '<div class="note warn" style="margin-top:12px"><strong>' + state.pasteErrors.length + " line" + (state.pasteErrors.length === 1 ? "" : "s") +
          ' could not be read</strong><ul class="bullets" style="margin-top:6px">' +
          state.pasteErrors.map(function (e) { return '<li class="sym" style="font-size:11.5px">' + esc(e) + "</li>"; }).join("") + "</ul></div>"
        : "") + "</section>" +

      '<section class="card pad"><h2 class="sec-title">Add one at a time</h2>' +
      '<p class="sub" style="margin-top:4px">Search the bundled universe by ticker or name.</p>' +
      '<div class="stack-s" style="margin-top:12px">' +

      '<label class="field"><span class="field-k">Value in ' + esc(state.profile.baseCurrency) + "</span>" +

      (state.addQuery && state.addQuery.length
        ? (function () {

            if (!hits.length) return '<p class="sub">No match in the bundled universe.</p>';
            return '<div class="card"><table class="data"><tbody>' + hits.map(function (s) {

            }).join("") + "</tbody></table></div>";
          })()
        : "") + "</div></section></div>" +

      '<section class="card pad"><h2 class="sec-title">Account settings</h2>' +

      }).join("") + "</select></label></div></section>" +

        ? '<section class="card"><div class="pad" style="display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)">' +

          '<p class="num" style="font-size:12.5px;color:var(--muted);margin-top:2px">' + cur(r.portfolio.totalValue) + " total" +

  var TOLERANCE = {

  function viewReference() {
    var r = report(), p = state.profile, ref = r.reference;
    var hasHoldings = r.portfolio.positions.length > 0;
    var slices = G.ASSET_CLASSES.filter(function (k) { return ref.assetClass[k] > 0.001; })
      .map(function (k) { return { label: lab(k), value: ref.assetClass[k] }; });
    function sel(id, act, value, opts) {
      return '<select id="' + id + '" data-act="' + act + '">' + opts.map(function (o) {
        return '<option value="' + o + '"' + (value === o ? " selected" : "") + ">" + esc(lab(o)) + "</option>";
      }).join("") + "</select>";
    }
    function numField(id, act, k, hint, value, min, max, step) {
      return '<label class="field"><span class="field-k">' + esc(k) + "</span>" +
        (hint ? '<span class="field-h">' + esc(hint) + "</span>" : "") +
